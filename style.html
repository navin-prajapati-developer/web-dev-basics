<!DOCTYPE html>
<html>
<head>
    <title>Styled Page</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            color: green;
        }

        p {
            color: lightgray;
            font-size: 18px;
        }

        .highlight {
            color: yellow;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Navin Prajapati</h1>
    <p>Aspiring Software Developer</p>
    <p class="highlight">Python • Java • SQL • Web Dev</p>
    <p>B.Sc IT 2025</p>
</body>
</html>
